<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-neutral-950 text-neutral-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aetheria / Creative Studio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@1,400;1,600&family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    @media (pointer: fine) {
      body { cursor: none; }
      a, button, [data-cursor] { cursor: none; }
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #404040; }
  </style>
</head>
<body class="selection:bg-neutral-100 selection:text-neutral-950 overflow-x-hidden">

  <!-- Custom Cursor Container -->
  <div id="cursor" class="fixed top-0 left-0 pointer-events-none z-50 rounded-full flex items-center justify-center text-center font-mono text-[10px] tracking-widest font-semibold uppercase text-black transition-[width,height,background-color,border] duration-300 ease-out hidden md:flex mix-blend-difference bg-white w-3 h-3 -translate-x-1/2 -translate-y-1/2">
    <span id="cursor-label" class="px-2 opacity-0 transition-opacity duration-200"></span>
  </div>

  <!-- Canvas Particle Background -->
  <canvas id="canvas-bg" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

  <!-- Header / Navigation -->
  <header class="fixed top-0 left-0 w-full z-40 px-6 md:px-16 py-6 flex justify-between items-center mix-blend-difference">
    <a href="#" class="font-mono text-xs uppercase tracking-widest text-neutral-100" data-cursor="pointer">STUDIO / AETHERIA</a>
    <nav class="hidden md:flex items-center gap-8 font-mono text-xs uppercase tracking-widest text-neutral-300">
      <a href="#work" class="hover:text-neutral-100 transition-colors" data-cursor="pointer">[ Work ]</a>
      <a href="#about" class="hover:text-neutral-100 transition-colors" data-cursor="pointer">[ Agency ]</a>
      <a href="#contact" class="hover:text-neutral-100 transition-colors" data-cursor="pointer">[ Contact ]</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="relative w-full min-h-screen flex flex-col justify-between p-6 md:p-16 border-b border-neutral-800/50 pt-24 z-10">
    <div class="w-full grid grid-cols-2 md:grid-cols-4 gap-4 text-xs font-mono tracking-wider uppercase text-neutral-500">
      <div>[ CREATIVE DIRECTION ]</div>
      <div>[ MOTION & CANVAS ]</div>
      <div class="hidden md:block">[ AVAILABLE 2026 ]</div>
      <div class="text-right">[ GLOBAL ]</div>
    </div>

    <div class="my-auto py-12 max-w-7xl">
      <p class="text-xs md:text-sm font-mono tracking-widest uppercase text-neutral-400 mb-4">High-Performance Visual Design</p>
      <h1 class="text-5xl sm:text-7xl lg:text-9xl font-light tracking-tight leading-[0.9] uppercase text-neutral-100">Architecting</h1>
      <h1 class="text-5xl sm:text-7xl lg:text-9xl font-serif italic text-neutral-400 tracking-tight leading-[0.9] mt-1">digital depth.</h1>
      
      <div class="mt-8 md:mt-12 grid grid-cols-1 md:grid-cols-12 gap-6 items-end">
        <p class="md:col-span-6 text-sm md:text-base text-neutral-400 font-light leading-relaxed">
          Bridging fine-art editorial layouts with interactive kinetic motion.
        </p>
        <div class="md:col-span-6 md:flex justify-end">
          <div class="magnetic-wrap inline-block">
            <a href="#work" data-cursor="pointer" class="magnetic-target inline-flex items-center gap-3 px-8 py-4 rounded-full border border-neutral-700 bg-neutral-900/80 text-xs font-mono uppercase tracking-widest text-neutral-100 hover:bg-neutral-100 hover:text-neutral-950 transition-colors duration-300">
              View Works <span>→</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Interactive JavaScript -->
  <script>
    // Cursor Logic
    const cursor = document.getElementById('cursor');
    const cursorLabel = document.getElementById('cursor-label');
    let mouseX = -100, mouseY = -100, cursorX = -100, cursorY = -100;

    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

    function animateCursor() {
      cursorX += (mouseX - cursorX) * 0.2;
      cursorY += (mouseY - cursorY) * 0.2;
      cursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0) translate(-50%, -50%)`;
      requestAnimationFrame(animateCursor);
    }
    requestAnimationFrame(animateCursor);

    // Cursor States
    document.addEventListener('mouseover', (e) => {
      const target = e.target.closest('[data-cursor]');
      if (!target) {
        cursor.className = "fixed top-0 left-0 pointer-events-none z-50 rounded-full flex items-center justify-center text-center font-mono text-[10px] tracking-widest font-semibold uppercase text-black transition-[width,height,background-color,border] duration-300 ease-out hidden md:flex mix-blend-difference bg-white w-3 h-3 -translate-x-1/2 -translate-y-1/2";
        cursorLabel.classList.add('opacity-0');
        return;
      }
      cursor.className = "fixed top-0 left-0 pointer-events-none z-50 rounded-full flex items-center justify-center text-center font-mono text-[10px] tracking-widest font-semibold uppercase text-black transition-[width,height,background-color,border] duration-300 ease-out hidden md:flex bg-white/20 border border-white/40 w-12 h-12 -translate-x-1/2 -translate-y-1/2";
    });

    // Particle Background
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width = 0, height = 0, particles = [];

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.size = Math.random() * 1.5 + 0.5;
        this.alpha = Math.random() * 0.3 + 0.1;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.globalAlpha = this.alpha;
        ctx.fill();
      }
    }

    function resizeCanvas() {
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = width; canvas.height = height;
      particles = Array.from({ length: Math.floor((width * height) / 15000) }, () => new Particle());
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(renderCanvas);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    renderCanvas();
  </script>
</body>
</html>
