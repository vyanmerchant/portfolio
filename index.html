<!DOCTYPE html>
<html lang="en" class="lenis lenis-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyan Merchant | Cinematic Editor</title>

<!-- FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- DEPENDENCIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root {
  --bg: #050505;
  --fg: #e8e8e3;
  --accent: #ff3300;
  --muted: #555555;
  --f-display: 'Anton', sans-serif;
  --f-sans: 'Syne', sans-serif;
  --f-serif: 'Cormorant Garamond', serif;
  --f-mono: 'Space Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html.lenis { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto; }
.lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
.lenis.lenis-stopped { overflow: hidden; }

body { background: var(--bg); color: var(--fg); font-family: var(--f-sans); overflow-x: hidden; cursor: none; -webkit-font-smoothing: antialiased; }

/* CURSOR SYSTEM */
#cursor { position: fixed; top: 0; left: 0; width: 12px; height: 12px; background: var(--fg); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); mix-blend-mode: difference; transition: width 0.3s, height 0.3s, background 0.3s; display: flex; justify-content: center; align-items: center; }
#cursor span { opacity: 0; font-family: var(--f-mono); font-size: 10px; font-weight: 700; color: var(--bg); text-transform: uppercase; transition: opacity 0.2s; }
.cursor-hover #cursor { width: 60px; height: 60px; background: transparent; border: 1px solid var(--fg); }
.cursor-play #cursor { width: 90px; height: 90px; background: var(--fg); mix-blend-mode: normal; }
.cursor-play #cursor span { opacity: 1; }

/* WEBGL HERO */
#webgl-hero { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.hero { position: relative; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2vw 4vw; overflow: hidden; }
.nav { display: flex; justify-content: space-between; z-index: 10; font-family: var(--f-mono); font-size: 0.8rem; text-transform: uppercase; mix-blend-mode: difference; }
.hero-title { z-index: 10; mix-blend-mode: difference; pointer-events: none; }
.hero-title h1 { font-family: var(--f-display); font-size: clamp(4rem, 15vw, 20rem); line-height: 0.8; margin: 0; letter-spacing: 0.02em; }
.hero-title .outline { -webkit-text-stroke: 1px var(--fg); color: transparent; }

/* KINETIC MANIFESTO */
.manifesto { padding: 15vw 4vw; background: var(--bg); position: relative; z-index: 2; border-top: 1px solid rgba(255,255,255,0.1); }
.manifesto p { font-size: clamp(2rem, 5vw, 6rem); line-height: 1.1; font-weight: 700; max-width: 90vw; margin: 0; }
.word { display: inline-block; overflow: hidden; vertical-align: bottom; }
.char { display: inline-block; transform: translateY(110%); color: var(--muted); transition: color 0.3s; }
.char.active { color: var(--fg); }
.highlight { color: var(--accent) !important; font-style: italic; font-family: var(--f-serif); padding-right: 1vw; }

/* HORIZONTAL WORK ARCHIVE */
.work-section { background: #0a0a0a; position: relative; z-index: 2; padding-top: 5vw; }
.work-header { padding: 0 4vw; font-family: var(--f-display); font-size: clamp(3rem, 8vw, 10rem); line-height: 0.9; text-transform: uppercase; }
.scroll-container { height: 100vh; width: 100%; overflow: hidden; perspective: 1200px; }
.scroll-track { display: flex; gap: 10vw; padding: 0 10vw; height: 100%; align-items: center; width: max-content; }
.project-card { width: 55vw; height: 70vh; position: relative; will-change: transform; transform-origin: center; display: flex; flex-direction: column; }
.project-visual { flex: 1; width: 100%; overflow: hidden; position: relative; filter: url(#velocity-glitch); }
.project-visual img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.3); filter: grayscale(100%); transition: filter 0.5s; }
.project-card:hover .project-visual img { filter: grayscale(0%); }
.project-meta { position: absolute; bottom: -3vw; left: -2vw; font-family: var(--f-display); font-size: clamp(3rem, 7vw, 9rem); line-height: 0.8; z-index: 2; mix-blend-mode: difference; white-space: nowrap; }
.project-meta span { font-family: var(--f-mono); font-size: 1.5rem; color: var(--accent); vertical-align: top; }

/* CINEMATIC FOOTER */
.footer { height: 100vh; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; z-index: 2; overflow: hidden; }
.footer-cta { font-family: var(--f-display); font-size: clamp(5rem, 18vw, 25rem); line-height: 0.8; text-transform: uppercase; text-align: center; cursor: none; position: relative; z-index: 10; }
.physics-orb { position: absolute; width: 30vw; height: 30vw; background: radial-gradient(circle, var(--accent) 0%, transparent 70%); opacity: 0.3; filter: blur(50px); border-radius: 50%; pointer-events: none; will-change: transform; }

svg.filters { position: absolute; width: 0; height: 0; pointer-events: none; }
</style>
</head>
<body>

<svg class="filters">
  <defs>
    <filter id="velocity-glitch">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" id="displace" />
    </filter>
  </defs>
</svg>

<div id="cursor"><span>Play</span></div>

<!-- HERO SECTION (WEBGL + MOUSE DEPTH) -->
<section class="hero">
  <canvas id="webgl-hero"></canvas>
  <div class="nav">
    <a href="#" class="mag">VM.</a>
    <div style="text-align: right;">Video Editor<br>Pune, India</div>
  </div>
  <div class="hero-title">
    <h1 class="outline">VYAN</h1>
    <h1>MERCHANT</h1>
  </div>
</section>

<!-- SECTION 2: KINETIC TYPOGRAPHY -->
<section class="manifesto">
  <p id="split-target">I craft fast-paced gaming edits that hit different. From clutch montages to creator packages. <span class="highlight">Edit. Fast. Hard.</span></p>
</section>

<!-- SECTION 3: HORIZONTAL SCROLL + DISTORTION -->
<section class="work-section">
  <div class="work-header">Archives</div>
  <div class="scroll-container">
    <div class="scroll-track">
      <div class="project-card play-trigger">
        <div class="project-visual"><img src="https://img.youtube.com/vi/d0qvLlFEEH8/maxresdefault.jpg" alt="Valorant"></div>
        <div class="project-meta">Valorant <span>01</span></div>
      </div>
      <div class="project-card play-trigger">
        <div class="project-visual"><img src="https://img.youtube.com/vi/4ZcBnbLWxvU/maxresdefault.jpg" alt="Legacy"></div>
        <div class="project-meta">Legacy <span>02</span></div>
      </div>
      <div class="project-card play-trigger">
        <div class="project-visual"><img src="https://img.youtube.com/vi/d0qvLlFEEH8/maxresdefault.jpg" alt="Practice"></div>
        <div class="project-meta">Practice <span>03</span></div>
      </div>
    </div>
  </div>
</section>

<!-- FOOTER: CINEMATIC & PHYSICS -->
<footer class="footer">
  <div class="physics-orb" id="orb"></div>
  <a href="mailto:vyanmerchant@gmail.com" class="footer-cta mag" style="color:var(--fg); text-decoration:none;">INITIATE</a>
</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

// 1. UTILS & SPLIT TEXT
function splitText(selector) {
  const el = document.querySelector(selector);
  const text = el.innerHTML;
  el.innerHTML = '';
  // Simple regex to split keeping HTML tags intact for the highlight span
  const words = text.split(/(<[^>]*>| )/g).filter(v => v.trim().length > 0 || v === ' ');
  let isHighlight = false;
  
  words.forEach(word => {
    if(word.includes('<span')) { isHighlight = true; return; }
    if(word.includes('</span')) { isHighlight = false; return; }
    if(word === ' ') { el.innerHTML += ' '; return; }
    
    let wordHTML = `<span class="word ${isHighlight ? 'highlight' : ''}">`;
    word.split('').forEach(char => {
      wordHTML += `<span class="char">${char}</span>`;
    });
    wordHTML += '</span>';
    el.innerHTML += wordHTML;
  });
}

document.addEventListener("DOMContentLoaded", () => {
  splitText('#split-target');
  initLenis();
  initCursor();
  initWebGLHero();
  initAnimations();
});

// 2. SMOOTH SCROLL
let lenis;
function initLenis() {
  lenis = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
  requestAnimationFrame(function raf(time) { lenis.raf(time); requestAnimationFrame(raf); });
}

// 3. MAGNETIC & STATE CURSOR
function initCursor() {
  const cursor = document.getElementById('cursor');
  let cx = 0, cy = 0, tx = 0, ty = 0;
  
  window.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
  gsap.ticker.add(() => {
    cx += (tx - cx) * 0.2; cy += (ty - cy) * 0.2;
    cursor.style.transform = `translate3d(${cx}px, ${cy}px, 0) translate(-50%, -50%)`;
  });

  document.querySelectorAll('.mag').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
  });
  document.querySelectorAll('.play-trigger').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('cursor-play'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-play'));
  });
}

// 4. HERO WEBGL (PARTICLE DEPTH)
function initWebGLHero() {
  const canvas = document.getElementById('webgl-hero');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 50;

  const geometry = new THREE.BufferGeometry();
  const count = 3000;
  const positions = new Float32Array(count * 3);
  for(let i=0; i<count*3; i++) { positions[i] = (Math.random() - 0.5) * 200; }
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  
  const material = new THREE.PointsMaterial({ size: 0.5, color: 0xffffff, transparent: true, opacity: 0.6 });
  const points = new THREE.Points(geometry, material);
  scene.add(points);

  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', e => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
  });

  function animate() {
    points.rotation.y += 0.001;
    camera.position.x += (mouseX * 10 - camera.position.x) * 0.05;
    camera.position.y += (mouseY * 10 - camera.position.y) * 0.05;
    camera.lookAt(scene.position);
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();
  window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); });
}

// 5. GSAP KINETIC & HORIZONTAL LOGIC
function initAnimations() {
  // Kinetic Text Reveal
  gsap.to('.char', {
    y: '0%', stagger: 0.01, ease: 'power3.out',
    scrollTrigger: { trigger: '.manifesto', start: 'top 80%', end: 'center center', scrub: 1 }
  });

  // Color Shift Effect
  gsap.utils.toArray('.char').forEach(char => {
    ScrollTrigger.create({
      trigger: char, start: 'top 60%', end: 'top 40%',
      onEnter: () => char.classList.add('active'),
      onLeaveBack: () => char.classList.remove('active')
    });
  });

  // Horizontal Scroll with Velocity Skew & SVG Distortion
  const track = document.querySelector('.scroll-track');
  const cards = gsap.utils.toArray('.project-card');
  const displaceMap = document.getElementById('displace');
  
  let scrollTween = gsap.to(track, {
    x: () => -(track.scrollWidth - document.documentElement.clientWidth) + "px",
    ease: "none",
    scrollTrigger: { trigger: ".scroll-container", pin: true, scrub: 1, end: () => "+=" + track.scrollWidth }
  });

  // Parallax Images
  gsap.utils.toArray('.project-visual img').forEach(img => {
    gsap.to(img, { x: () => img.parentElement.offsetWidth * 0.3, ease: "none", scrollTrigger: { trigger: ".scroll-container", containerAnimation: scrollTween, start: "left right", end: "right left", scrub: true } });
  });

  // Velocity-based Skew & Glitch
  let proxy = { skew: 0, filter: 0 };
  let skewSetter = gsap.quickSetter(cards, "rotationY", "deg");
  
  ScrollTrigger.create({
    onUpdate: (self) => {
      let vel = self.getVelocity();
      let skew = gsap.utils.clamp(-10, 10, vel / -200);
      let filterAmt = gsap.utils.clamp(0, 30, Math.abs(vel / 100));
      
      if (Math.abs(skew) > Math.abs(proxy.skew)) {
        proxy.skew = skew;
        gsap.to(proxy, { skew: 0, duration: 1, ease: "power3", overwrite: true, onUpdate: () => skewSetter(proxy.skew) });
      }
      if (filterAmt > proxy.filter) {
        proxy.filter = filterAmt;
        gsap.to(proxy, { filter: 0, duration: 0.5, onUpdate: () => { displaceMap.setAttribute('scale', proxy.filter); } });
      }
    }
  });

  // Footer Physics Orb
  const orb = document.getElementById('orb');
  window.addEventListener('mousemove', e => {
    gsap.to(orb, { x: e.clientX - window.innerWidth/2, y: e.clientY - window.innerHeight/2, duration: 2, ease: 'expo.out' });
  });
}
</script>
</body>
</html>
